<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>なんばせんせいと ながさを はかろう！【cmとmm】</title>
  <style>
    :root {
      --primary-color: #0284c7;
      --primary-dark: #0369a1;
      --primary-light: #e0f2fe;
      --accent-color: #f97316;
      --cool-dark: #0f172a;
      --cool-blue: #1e293b;
      --success-color: #16a34a;
      --danger-color: #dc2626;
      --warning-color: #eab308;
      --bg-color: #f1f5f9;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #475569;
      --border-color: #cbd5e1;
      --shadow-sm: 0 2px 4px rgba(0,0,0,0.06);
      --shadow-md: 0 6px 16px -2px rgba(15,23,42,0.1);
      --shadow-lg: 0 16px 32px -4px rgba(15,23,42,0.15);
      --font-family: system-ui, -apple-system, "UD デジタル 教科書体 N-R", "UD Digital Textbook NP-R", "BIZ UDPGothic", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: var(--font-family);
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px;
      touch-action: manipulation;
    }

    .app-container {
      width: 100%;
      max-width: 1080px;
      background: var(--card-bg);
      border-radius: 28px;
      box-shadow: var(--shadow-lg);
      border: 3px solid #cbd5e1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ヘッダー */
    header {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 60%, #0369a1 100%);
      color: white;
      padding: 14px 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 4px solid #0284c7;
    }

    .app-title-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .app-icon {
      width: 46px;
      height: 46px;
      background: #38bdf8;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .app-title {
      font-size: 1.45rem;
      font-weight: 900;
      letter-spacing: 0.04em;
    }

    .app-subtitle {
      font-size: 0.85rem;
      color: #94a3b8;
      font-weight: 700;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-sound-toggle {
      background: rgba(255,255,255,0.12);
      border: 2px solid rgba(255,255,255,0.4);
      color: white;
      border-radius: 30px;
      padding: 8px 18px;
      font-size: 0.95rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn-sound-toggle:hover {
      background: rgba(255,255,255,0.25);
    }

    /* モード選択タブ */
    .mode-selector {
      background: #f8fafc;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      border-bottom: 2px solid #e2e8f0;
    }

    .mode-tab-btn {
      flex: 1;
      max-width: 420px;
      padding: 12px 18px;
      font-size: 1.2rem;
      font-weight: 900;
      font-family: inherit;
      border-radius: 18px;
      border: 3px solid #cbd5e1;
      background: #ffffff;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 3px 0 #cbd5e1;
    }

    .mode-tab-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #cbd5e1;
    }

    .mode-tab-btn.active.assist-mode {
      background: #e0f2fe;
      border-color: #0284c7;
      color: #0369a1;
      box-shadow: 0 4px 0 #0284c7;
    }

    .mode-tab-btn.active.challenge-mode {
      background: #f1f5f9;
      border-color: #334155;
      color: #0f172a;
      box-shadow: 0 4px 0 #1e293b;
    }

    .mode-badge {
      font-size: 0.8rem;
      background: #0284c7;
      color: white;
      padding: 2px 10px;
      border-radius: 20px;
      font-weight: 800;
    }

    .mode-tab-btn.active.challenge-mode .mode-badge {
      background: #0f172a;
    }

    /* 若くてクールな「難波先生」キャラクターエリア */
    .teacher-section {
      background: linear-gradient(to right, #f8fafc, #f1f5f9);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 20px;
      border-bottom: 3px solid #e2e8f0;
      position: relative;
    }

    .teacher-avatar-container {
      flex-shrink: 0;
      position: relative;
      width: 105px;
      height: 105px;
    }

    .teacher-avatar-svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 6px 12px rgba(15,23,42,0.18));
    }

    .teacher-name-tag {
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%);
      background: #0f172a;
      color: #38bdf8;
      border: 1.5px solid #38bdf8;
      font-weight: 900;
      font-size: 0.8rem;
      padding: 3px 12px;
      border-radius: 12px;
      white-space: nowrap;
      box-shadow: 0 2px 6px rgba(0,0,0,0.25);
    }

    .speech-bubble {
      flex: 1;
      background: white;
      border: 3px solid #0284c7;
      border-radius: 22px;
      padding: 16px 24px;
      position: relative;
      box-shadow: var(--shadow-sm);
      min-height: 86px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .speech-bubble::before {
      content: '';
      position: absolute;
      top: 50%;
      left: -18px;
      transform: translateY(-50%);
      border-width: 11px 18px 11px 0;
      border-style: solid;
      border-color: transparent #0284c7 transparent transparent;
    }

    .speech-bubble::after {
      content: '';
      position: absolute;
      top: 50%;
      left: -13px;
      transform: translateY(-50%);
      border-width: 9px 14px 9px 0;
      border-style: solid;
      border-color: transparent white transparent transparent;
    }

    .speech-text {
      font-size: 1.35rem;
      font-weight: 900;
      line-height: 1.55;
      color: #0f172a;
      letter-spacing: 0.03em;
    }

    .speech-actions {
      margin-top: 8px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-replay-voice {
      background: #f0f9ff;
      border: 2px solid #0284c7;
      color: #0369a1;
      font-size: 0.9rem;
      font-weight: 800;
      border-radius: 14px;
      padding: 5px 14px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s;
    }

    .btn-replay-voice:hover {
      background: #e0f2fe;
    }

    /* メインコンテンツエリア */
    .main-content {
      padding: 18px 22px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    /* 写真撮影・読み込み操作バー */
    .photo-control-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: #f8fafc;
      padding: 12px 18px;
      border-radius: 20px;
      border: 2px solid #e2e8f0;
    }

    .photo-action-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn-take-photo {
      background: linear-gradient(135deg, #0284c7, #0369a1);
      color: white;
      border: none;
      padding: 11px 22px;
      border-radius: 16px;
      font-size: 1.1rem;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 0 #075985;
      transition: all 0.15s;
    }

    .btn-take-photo:hover {
      background: linear-gradient(135deg, #0369a1, #0284c7);
    }

    .btn-take-photo:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #075985;
    }

    .btn-sample-photo {
      background: #ffffff;
      border: 2px solid #64748b;
      color: #334155;
      padding: 10px 18px;
      border-radius: 16px;
      font-size: 0.95rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s;
    }

    .btn-sample-photo:hover {
      background: #f1f5f9;
      border-color: #0f172a;
    }

    /* 計測ステージ・写真エリア */
    .stage-wrapper {
      position: relative;
      background: #0f172a;
      border: 3px solid #334155;
      border-radius: 24px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      min-height: 310px;
      box-shadow: inset 0 2px 10px rgba(0,0,0,0.4);
    }

    /* アニメーション支援コントロール */
    .assist-anim-bar {
      width: 100%;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: #1e293b;
      border: 2px solid #0284c7;
      border-radius: 18px;
      padding: 10px 20px;
    }

    .assist-guide-text {
      font-size: 1.05rem;
      font-weight: 800;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-zoom-anim {
      background: linear-gradient(135deg, #f97316, #ea580c);
      color: white;
      border: none;
      padding: 12px 26px;
      border-radius: 18px;
      font-size: 1.25rem;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 0 #9a3412;
      transition: all 0.15s;
    }

    .btn-zoom-anim:hover {
      background: linear-gradient(135deg, #fb923c, #f97316);
    }

    .btn-zoom-anim:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #9a3412;
    }

    .btn-zoom-anim:disabled {
      background: #475569;
      color: #94a3b8;
      box-shadow: none;
      cursor: not-allowed;
      transform: none;
    }

    .btn-reset-zoom {
      background: rgba(255,255,255,0.15);
      border: 1.5px solid rgba(255,255,255,0.4);
      color: white;
      padding: 8px 14px;
      border-radius: 14px;
      font-size: 0.9rem;
      font-weight: 800;
      cursor: pointer;
      display: none;
    }

    /* ステージグラフィック表示コンテナ（写真＋ものさし＋アニメーション） */
    .stage-canvas-area {
      position: relative;
      width: 100%;
      max-width: 960px;
      height: 240px;
      background: #1e293b;
      border-radius: 20px;
      overflow: hidden;
      cursor: crosshair;
    }

    .stage-svg {
      width: 100%;
      height: 100%;
      display: block;
      transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
      transform-origin: 0 0;
    }

    /* ズームアップ時のスタイル */
    .stage-svg.is-zoomed {
      /* JSで動的にズーム原点とスケールを設定 */
    }

    /* ズーム中バッジ表示 */
    .zoom-indicator-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(2, 132, 199, 0.9);
      color: white;
      font-size: 0.85rem;
      font-weight: 900;
      padding: 4px 12px;
      border-radius: 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      display: none;
      align-items: center;
      gap: 6px;
      z-index: 10;
      backdrop-filter: blur(4px);
    }

    /* 点滅アニメーション */
    @keyframes pulseGlow {
      0%, 100% { filter: drop-shadow(0 0 8px #f59e0b); stroke-width: 4.5; }
      50% { filter: drop-shadow(0 0 20px #ef4444); stroke-width: 6; }
    }

    @keyframes lineBlink {
      0%, 100% { opacity: 1; stroke-width: 5; }
      50% { opacity: 0.25; stroke-width: 3; }
    }

    .highlight-cm-pulse {
      animation: pulseGlow 0.75s infinite;
    }

    .target-line-blink {
      animation: lineBlink 0.5s infinite;
    }

    /* 下部：解答・テンキーエリア */
    .interaction-panel {
      display: grid;
      grid-template-columns: 1fr 1.15fr;
      gap: 18px;
      align-items: start;
    }

    @media (max-width: 768px) {
      .interaction-panel {
        grid-template-columns: 1fr;
      }
    }

    /* 穴埋め解答カード */
    .answer-card {
      background: #ffffff;
      border: 3px solid #cbd5e1;
      border-radius: 24px;
      padding: 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      box-shadow: var(--shadow-sm);
    }

    .answer-title {
      font-size: 1.3rem;
      font-weight: 900;
      color: #0f172a;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .answer-boxes-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      width: 100%;
    }

    .answer-slot-group {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .answer-box {
      width: 92px;
      height: 82px;
      background: #f8fafc;
      border: 4px solid #cbd5e1;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.6rem;
      font-weight: 900;
      color: #0f172a;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: inset 0 3px 6px rgba(0,0,0,0.06);
    }

    .answer-box.active {
      border-color: #0284c7;
      background: #f0f9ff;
      box-shadow: 0 0 0 5px rgba(2,132,199,0.25), inset 0 2px 4px rgba(2,132,199,0.1);
      transform: scale(1.05);
    }

    .answer-box.highlight-error {
      border-color: #dc2626 !important;
      background: #fef2f2 !important;
      box-shadow: 0 0 0 6px rgba(220,38,38,0.3) !important;
      animation: shakeBox 0.5s ease-in-out;
    }

    @keyframes shakeBox {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    .unit-label {
      font-size: 2.1rem;
      font-weight: 900;
      color: #334155;
    }

    .input-indicator-text {
      font-size: 1.05rem;
      font-weight: 900;
      color: #0369a1;
      background: #e0f2fe;
      padding: 6px 20px;
      border-radius: 24px;
      border: 2px solid #bae6fd;
    }

    /* テンキーエリア */
    .keypad-container {
      background: #f8fafc;
      border: 3px solid #e2e8f0;
      border-radius: 24px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: var(--shadow-sm);
    }

    .keypad-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .key-btn {
      height: 68px;
      font-size: 2rem;
      font-weight: 900;
      font-family: inherit;
      border-radius: 18px;
      border: 2px solid #cbd5e1;
      background: #ffffff;
      color: #0f172a;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 0 #94a3b8;
      transition: all 0.1s ease;
    }

    .key-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #94a3b8;
      background: #f1f5f9;
    }

    .key-btn.action-delete {
      background: #fef2f2;
      border-color: #fca5a5;
      color: #b91c1c;
      font-size: 1.35rem;
      box-shadow: 0 4px 0 #f87171;
    }

    .key-btn.action-delete:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #f87171;
    }

    .key-btn.action-submit {
      background: #16a34a;
      border-color: #15803d;
      color: white;
      font-size: 1.45rem;
      font-weight: 900;
      box-shadow: 0 4px 0 #166534;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .key-btn.action-submit:hover {
      background: #22c55e;
    }

    .key-btn.action-submit:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #166534;
    }

    /* 花丸大正解モーダル */
    .hanamaru-modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(5px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      animation: fadeIn 0.3s forwards;
    }

    .hanamaru-modal-overlay.show {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .hanamaru-modal-card {
      background: white;
      border-radius: 36px;
      padding: 34px 26px;
      width: 90%;
      max-width: 500px;
      text-align: center;
      box-shadow: 0 24px 50px rgba(0,0,0,0.4);
      border: 6px solid #fbbf24;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: scalePop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes scalePop {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .hanamaru-svg-box {
      width: 195px;
      height: 195px;
      margin-bottom: 16px;
      animation: rotateHanamaru 1s ease-out;
    }

    @keyframes rotateHanamaru {
      0% { transform: scale(0.2) rotate(-60deg); opacity: 0; }
      70% { transform: scale(1.15) rotate(10deg); }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }

    .hanamaru-text-main {
      font-size: 2.4rem;
      font-weight: 900;
      color: #dc2626;
      margin-bottom: 10px;
    }

    .hanamaru-text-sub {
      font-size: 1.35rem;
      font-weight: 800;
      color: #0369a1;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .btn-next-action {
      background: linear-gradient(135deg, #0284c7, #0369a1);
      color: white;
      border: none;
      padding: 16px 40px;
      font-size: 1.45rem;
      font-weight: 900;
      border-radius: 22px;
      cursor: pointer;
      box-shadow: 0 5px 0 #075985;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      transition: all 0.15s;
    }

    .btn-next-action:hover {
      background: linear-gradient(135deg, #0369a1, #0284c7);
    }

    .btn-next-action:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #075985;
    }

    /* 長さ手動微調整バー（先生・設定用） */
    .length-setting-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--text-muted);
    }

    .length-setting-inputs {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .length-select {
      font-size: 1rem;
      font-weight: 900;
      padding: 5px 8px;
      border-radius: 10px;
      border: 2px solid #cbd5e1;
      background: white;
    }

    #fileInput {
      display: none;
    }

    /* フッター */
    footer {
      padding: 14px;
      text-align: center;
      font-size: 0.9rem;
      color: var(--text-muted);
      font-weight: 700;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- ヘッダー -->
    <header>
      <div class="app-title-group">
        <div class="app-icon">📏</div>
        <div>
          <h1 class="app-title">なんばせんせいと ながさを はかろう！</h1>
          <div class="app-subtitle">特別支援学校 中学部段階2「長さ（cmとmm）」</div>
        </div>
      </div>
      <div class="header-actions">
        <button id="btnSoundToggle" class="btn-sound-toggle" title="音声のON/OFF">
          <span id="soundIcon">🔊</span>
          <span id="soundStatusText">こえ：ON</span>
        </button>
      </div>
    </header>

    <!-- モード選択タブ -->
    <div class="mode-selector">
      <button id="btnModeAssist" class="mode-tab-btn assist-mode active" title="てだすけ ありモード">
        <span>✨【てだすけ あり】</span>
        <span class="mode-badge">ズーム＆アニメーション</span>
      </button>

  <!-- JavaScript -->
  <script>
    /**
     * アプリケーション全体状態
     */
    const STATE = {
      mode: 'assist', // 'assist' | 'challenge'
      soundEnabled: true,
      currentSlot: 'cm', // 'cm' | 'mm'
      inputCm: '',
      inputMm: '',
      targetCm: 7,
      targetMm: 4,
      isAnimating: false,
      isZoomed: false,
      currentPhotoType: 'sample1', // 'sample1' | 'sample2' | 'user'
      userImageDataUrl: null,
      PIXELS_PER_CM: 48,
      RULER_ORIGIN_X: 40,
    };

    /**
     * Web Audio API 音声効果音エンジン
     */
    class SoundEngine {
      constructor() {
        this.ctx = null;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            this.ctx = new AudioContext();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playTone(freq, type = 'sine', duration = 0.15, gainVal = 0.25) {
        if (!STATE.soundEnabled) return;
        this.init();
        if (!this.ctx) return;

        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);

        gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start();
        osc.stop(this.ctx.currentTime + duration);
      }

      playKeyTap() {
        this.playTone(520, 'sine', 0.08, 0.2);
      }

      playCountTick(pitch = 600) {
        this.playTone(pitch, 'triangle', 0.09, 0.25);
      }

      playOshii() {
        if (!STATE.soundEnabled) return;
        this.init();
        if (!this.ctx) return;

        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(340, now);
        osc.frequency.exponentialRampToValueAtTime(220, now + 0.35);

        gain.gain.setValueAtTime(0.3, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.35);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(now + 0.35);
      }

      playFanfare() {
        if (!STATE.soundEnabled) return;
        this.init();
        if (!this.ctx) return;

        const notes = [
          { f: 523.25, time: 0, d: 0.18 },
          { f: 659.25, time: 0.16, d: 0.18 },
          { f: 783.99, time: 0.32, d: 0.22 },
          { f: 1046.50, time: 0.52, d: 0.75 },
          { f: 1318.51, time: 0.54, d: 0.75 }
        ];

        notes.forEach(n => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(n.f, this.ctx.currentTime + n.time);

          gain.gain.setValueAtTime(0.32, this.ctx.currentTime + n.time);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + n.time + n.d);

          osc.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start(this.ctx.currentTime + n.time);
          osc.stop(this.ctx.currentTime + n.time + n.d);
        });
      }
    }

    const sound = new SoundEngine();

    /**
     * Web Speech API (音声読み上げ)
     */
    function speakTeacher(text) {
      if (!STATE.soundEnabled) return;
      if (!('speechSynthesis' in window)) return;

      window.speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'ja-JP';
      utterance.rate = 0.95; // クールで聞き取りやすいテンポ
      utterance.pitch = 1.05; // 落ち着いた爽やかな先生の声

      const mouth = document.getElementById('teacherMouth');
      utterance.onstart = () => {
        if (mouth) mouth.setAttribute('d', 'M 44 58 Q 50 66 56 58');
      };
      utterance.onend = () => {
        if (mouth) mouth.setAttribute('d', 'M 45 59 Q 50 62 55 59');
      };

      window.speechSynthesis.speak(utterance);
    }

    function updateTeacherSpeech(message, speakNow = true) {
      const speechElem = document.getElementById('speechText');
      if (speechElem) {
        speechElem.innerHTML = message;
      }
      if (speakNow) {
        const plainText = message.replace(/<[^>]*>/g, '');
        speakTeacher(plainText);
      }
    }

    /**
     * 定規の目盛り描画 (0cm〜15cm)
     */
    function renderRulerTicks() {
      const ticksGroup = document.getElementById('rulerTicks');
      ticksGroup.innerHTML = '';

      const totalCm = 15;
      const pxPerCm = STATE.PIXELS_PER_CM;

      for (let cm = 0; cm <= totalCm; cm++) {
        const cmX = cm * pxPerCm;

        // cmの大目盛り線
        const cmLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        cmLine.setAttribute('x1', cmX);
        cmLine.setAttribute('y1', 0);
        cmLine.setAttribute('x2', cmX);
        cmLine.setAttribute('y2', 38);
        cmLine.setAttribute('stroke', '#0f172a');
        cmLine.setAttribute('stroke-width', '2.8');
        ticksGroup.appendChild(cmLine);

        // cmの数字ラベル
        const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        text.setAttribute('x', cmX);
        text.setAttribute('y', 64);
        text.setAttribute('font-size', '20');
        text.setAttribute('font-weight', '900');
        text.setAttribute('fill', '#0f172a');
        text.setAttribute('text-anchor', 'middle');
        text.setAttribute('id', `cmText_${cm}`);
        text.textContent = cm;
        ticksGroup.appendChild(text);

        // 1mm〜9mmの目盛り線
        if (cm < totalCm) {
          for (let mm = 1; mm <= 9; mm++) {
            const mmX = cmX + (mm * (pxPerCm / 10));
            const is5mm = (mm === 5);
            const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            line.setAttribute('x1', mmX);
            line.setAttribute('y1', 0);
            line.setAttribute('x2', mmX);
            line.setAttribute('y2', is5mm ? 26 : 17);
            line.setAttribute('stroke', is5mm ? '#334155' : '#64748b');
            line.setAttribute('stroke-width', is5mm ? '2.2' : '1.3');
            line.setAttribute('id', `mmTick_${cm}_${mm}`);
            ticksGroup.appendChild(line);
          }
        }
      }
    }

    /**
     * ステージの物体／写真の再描画
     */
    function updateStageVisuals() {
      const objLayer = document.getElementById('measuredObjectLayer');
      const customImgGroup = document.getElementById('customPhotoImageGroup');
      const widthPx = (STATE.targetCm * STATE.PIXELS_PER_CM) + (STATE.targetMm * (STATE.PIXELS_PER_CM / 10));

      if (STATE.currentPhotoType === 'user' && STATE.userImageDataUrl) {
        // ユーザーが撮影した写真モード
        customImgGroup.innerHTML = `
          <image href="${STATE.userImageDataUrl}" x="0" y="0" width="920" height="220" preserveAspectRatio="xMidYMid slice" opacity="0.45"/>
        `;
        // 写真上の物体測定バー
        objLayer.innerHTML = `
          <g filter="url(#shadow)">
            <rect x="0" y="10" width="${widthPx}" height="65" rx="8" fill="rgba(56, 189, 248, 0.4)" stroke="#38bdf8" stroke-width="3"/>
            <text x="${widthPx / 2}" y="48" font-size="18" font-weight="900" fill="#ffffff" text-anchor="middle">写真の ものの 長さ</text>
            <!-- 右端ポインター -->
            <polygon points="${widthPx - 10},0 ${widthPx},10 ${widthPx - 10},20" fill="#f97316"/>
          </g>
        `;
      } else if (STATE.currentPhotoType === 'sample2') {
        // 見本写真②: 消しゴム
        customImgGroup.innerHTML = '';
        objLayer.innerHTML = `
          <g filter="url(#shadow)">
            <rect x="0" y="16" width="${widthPx}" height="52" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
            <rect x="0" y="14" width="${widthPx * 0.72}" height="56" rx="5" fill="#0284c7" stroke="#0369a1" stroke-width="2"/>
            <rect x="4" y="28" width="${widthPx * 0.72 - 8}" height="16" fill="#ffffff" rx="3"/>
            <text x="${(widthPx * 0.72) / 2}" y="41" font-size="12" font-weight="900" fill="#0284c7" text-anchor="middle">MONO ERASER</text>
          </g>
        `;
      } else {
        // 見本写真①: ペン
        customImgGroup.innerHTML = '';
        objLayer.innerHTML = `
          <g filter="url(#shadow)">
            <rect x="0" y="24" width="${widthPx - 38}" height="32" rx="4" fill="#0284c7" stroke="#0369a1" stroke-width="2"/>
            <line x1="0" y1="34" x2="${widthPx - 38}" y2="34" stroke="#7dd3fc" stroke-width="2"/>
            <line x1="0" y1="46" x2="${widthPx - 38}" y2="46" stroke="#075985" stroke-width="2"/>
            <polygon points="${widthPx - 38},24 ${widthPx},40 ${widthPx - 38},56" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
            <polygon points="${widthPx - 14},35 ${widthPx},40 ${widthPx - 14},45" fill="#0f172a"/>
            <!-- クリップ金具 -->
            <rect x="0" y="22" width="18" height="36" rx="2" fill="#94a3b8" stroke="#475569" stroke-width="1.5"/>
            <rect x="0" y="25" width="9" height="30" rx="2" fill="#38bdf8"/>
          </g>
        `;
      }

      // 先生用セレクトボックス同期
      document.getElementById('selectTargetCm').value = STATE.targetCm;
      document.getElementById('selectTargetMm').value = STATE.targetMm;

      // 入力初期化
      STATE.inputCm = '';
      STATE.inputMm = '';
      STATE.currentSlot = 'cm';
      updateAnswerBoxes();
      clearHighlights();
      resetAnimationLayer();
      resetZoomView();
    }

    /**
     * ズームアップ状態の切り替え
     * 「アニメーションはズームアップした状態でできるようにしてほしい」
     */
    function setZoomView(isZoomed) {
      STATE.isZoomed = isZoomed;
      const svg = document.getElementById('mainStageSvg');
      const badge = document.getElementById('zoomBadge');
      const resetBtn = document.getElementById('btnResetZoom');

      if (isZoomed) {
        // ターゲットの右端（cm + mm）周辺に2.8倍ズーム
        const targetX = STATE.RULER_ORIGIN_X + (STATE.targetCm * STATE.PIXELS_PER_CM) + (STATE.targetMm * (STATE.PIXELS_PER_CM / 10));
        const zoom = 2.8;

        // viewBoxを動的に変化させてスムーズにズーム
        const viewW = 920 / zoom;
        const viewH = 220 / zoom;
        const viewX = Math.max(0, Math.min(920 - viewW, targetX - (viewW * 0.65)));
        const viewY = 40; // 定規と右端のちょうど中間

        svg.setAttribute('viewBox', `${viewX} ${viewY} ${viewW} ${viewH}`);
        badge.style.display = 'inline-flex';
        resetBtn.style.display = 'block';
      } else {
        svg.setAttribute('viewBox', '0 0 920 220');
        badge.style.display = 'none';
        resetBtn.style.display = 'none';
      }
    }

    function resetZoomView() {
      setZoomView(false);
    }

    /**
     * 解答スロット枠の更新
     */
    function updateAnswerBoxes() {
      const boxCm = document.getElementById('boxCm');
      const boxMm = document.getElementById('boxMm');
      const indicator = document.getElementById('inputIndicatorText');

      boxCm.textContent = STATE.inputCm;
      boxMm.textContent = STATE.inputMm;

      boxCm.classList.toggle('active', STATE.currentSlot === 'cm');
      boxMm.classList.toggle('active', STATE.currentSlot === 'mm');

      if (STATE.currentSlot === 'cm') {
        indicator.textContent = 'いま「cm」を いれているよ（大きい線の数字）';
      } else {
        indicator.textContent = 'いま「mm」を いれているよ（小さい線の数）';
      }
    }

    /**
     * ハイライトのクリア
     */
    function clearHighlights() {
      document.getElementById('cmHighlightOverlay').innerHTML = '';
      document.getElementById('mmHighlightOverlay').innerHTML = '';
      document.getElementById('boxCm').classList.remove('highlight-error');
      document.getElementById('boxMm').classList.remove('highlight-error');
    }

    /**
     * cmの間違い時仕様
     * メッセージ：「おしい！ 大きい 線の すうじ（cm）を もういちど 見てみよう。もう一度 答えてみよう！」
     * 視覚ヒント：定規のcm数字付近をハイライト
     */
    function highlightCmHint() {
      clearHighlights();
      const targetCm = STATE.targetCm;
      const cmOverlay = document.getElementById('cmHighlightOverlay');
      const pxPerCm = STATE.PIXELS_PER_CM;

      const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      circle.setAttribute('cx', targetCm * pxPerCm);
      circle.setAttribute('cy', 60);
      circle.setAttribute('r', 25);
      circle.setAttribute('fill', 'rgba(250, 204, 21, 0.5)');
      circle.setAttribute('stroke', '#dc2626');
      circle.setAttribute('stroke-width', '4');
      circle.setAttribute('class', 'highlight-cm-pulse');
      cmOverlay.appendChild(circle);

      document.getElementById('boxCm').classList.add('highlight-error');
      STATE.currentSlot = 'cm';
      updateAnswerBoxes();
    }

    /**
     * mmの間違い時仕様
     * メッセージ：「おしい！ 小さい 線（mm）を 1、2、3… と 数えてみよう。もう一度 答えてみよう！」
     * 視覚ヒント：mm目盛り線をハイライト
     */
    function highlightMmHint() {
      clearHighlights();
      const targetCm = STATE.targetCm;
      const targetMm = STATE.targetMm;
      const mmOverlay = document.getElementById('mmHighlightOverlay');
      const pxPerCm = STATE.PIXELS_PER_CM;
      const startX = targetCm * pxPerCm;

      for (let mm = 1; mm <= targetMm; mm++) {
        const mmX = startX + (mm * (pxPerCm / 10));
        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', mmX);
        line.setAttribute('y1', 0);
        line.setAttribute('x2', mmX);
        line.setAttribute('y2', 36);
        line.setAttribute('stroke', '#dc2626');
        line.setAttribute('stroke-width', '4.5');
        mmOverlay.appendChild(line);

        const num = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        num.setAttribute('x', mmX);
        num.setAttribute('y', -6);
        num.setAttribute('font-size', '14');
        num.setAttribute('font-weight', '900');
        num.setAttribute('fill', '#dc2626');
        num.setAttribute('text-anchor', 'middle');
        num.textContent = mm;
        mmOverlay.appendChild(num);
      }

      document.getElementById('boxMm').classList.add('highlight-error');
      STATE.currentSlot = 'mm';
      updateAnswerBoxes();
    }

    /**
     * 採点処理
     */
    function checkAnswer() {
      const userCm = parseInt(STATE.inputCm, 10);
      const userMm = parseInt(STATE.inputMm, 10);

      if (isNaN(userCm) || isNaN(userMm)) {
        sound.playOshii();
        updateTeacherSpeech('すうじ を「cm」と「mm」の 両方に いれてみよう！');
        STATE.currentSlot = isNaN(userCm) ? 'cm' : 'mm';
        updateAnswerBoxes();
        return;
      }

      const isCmCorrect = (userCm === STATE.targetCm);
      const isMmCorrect = (userMm === STATE.targetMm);

      if (isCmCorrect && isMmCorrect) {
        // 1. 正解時
        clearHighlights();
        sound.playFanfare();
        const successMsg = `すごーい！しっかり はかれたね！ ${STATE.targetCm}cm ${STATE.targetMm}mm だね。はなまる！`;
        updateTeacherSpeech(successMsg);
        showHanamaruModal(successMsg);

      } else if (!isCmCorrect) {
        // 2. 「cm」の間違い時
        sound.playOshii();
        highlightCmHint();
        updateTeacherSpeech('おしい！ 大きい 線の すうじ（cm）を もういちど 見てみよう。もう一度 答えてみよう！');

      } else {
        // 3. 「mm」の間違い時
        sound.playOshii();
        highlightMmHint();
        updateTeacherSpeech('おしい！ 小さい 線（mm）を 1、2、3… と 数えてみよう。もう一度 答えてみよう！');
      }
    }

    function showHanamaruModal(message) {
      document.getElementById('hanamaruFeedbackText').textContent = message;
      document.getElementById('hanamaruModal').classList.add('show');
    }

    function hideHanamaruModal() {
      document.getElementById('hanamaruModal').classList.remove('show');
    }

    function resetAnimationLayer() {
      STATE.isAnimating = false;
      const btn = document.getElementById('btnZoomAnim');
      if (btn) btn.disabled = false;

      document.getElementById('animCmLine').style.display = 'none';
      document.getElementById('animCmLabelBg').style.display = 'none';
      document.getElementById('animCmLabel').style.display = 'none';
      document.getElementById('animMmLinesGroup').innerHTML = '';
      const targetLine = document.getElementById('animTargetLine');
      targetLine.style.display = 'none';
      targetLine.classList.remove('target-line-blink');
    }

    /**
     * 【てだすけ あり】ズームアップ状態でのアニメーション
     * 1. ズームアップ
     * 2. cmの基準線表示
     * 3. mmのカウントアップ
     * 4. 目的位置で停止・点滅
     */
    async function runZoomGuideAnimation() {
      if (STATE.isAnimating) return;
      STATE.isAnimating = true;

      const btn = document.getElementById('btnZoomAnim');
      btn.disabled = true;
      clearHighlights();
      resetAnimationLayer();

      const targetCm = STATE.targetCm;
      const targetMm = STATE.targetMm;
      const pxPerCm = STATE.PIXELS_PER_CM;

      // ステップ 0: ズームアップ！
      setZoomView(true);
      updateTeacherSpeech(`ズームアップしたよ！ よく 見てみよう。`, false);
      await sleep(650);

      // ステップ 1: cmの基準線表示（太い赤色の基準線）
      updateTeacherSpeech(`まず、大きい 線の ${targetCm}cm を 見るよ！`);
      sound.playCountTick(440);

      const cmX = targetCm * pxPerCm;
      const cmLine = document.getElementById('animCmLine');
      const cmBg = document.getElementById('animCmLabelBg');
      const cmLabel = document.getElementById('animCmLabel');

      cmLine.setAttribute('x1', cmX);
      cmLine.setAttribute('x2', cmX);
      cmLine.style.display = 'block';

      cmBg.setAttribute('x', cmX - 32);
      cmBg.style.display = 'block';

      cmLabel.setAttribute('x', cmX);
      cmLabel.textContent = `${targetCm}cm`;
      cmLabel.style.display = 'block';

      await sleep(1300);

      // ステップ 2: mmのカウントアップ
      const mmGroup = document.getElementById('animMmLinesGroup');

      if (targetMm > 0) {
        updateTeacherSpeech(`つぎに、小さい 線（mm）を 1、2、3… と 数えるよ！`, false);

        for (let mm = 1; mm <= targetMm; mm++) {
          await sleep(650);
          sound.playCountTick(520 + (mm * 35));

          const mmX = cmX + (mm * (pxPerCm / 10));
          const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
          line.setAttribute('x1', mmX);
          line.setAttribute('y1', 15);
          line.setAttribute('x2', mmX);
          line.setAttribute('y2', 185);
          line.setAttribute('stroke', '#ea580c');
          line.setAttribute('stroke-width', '3');
          mmGroup.appendChild(line);

          const countText = `${targetCm}cm ${mm}mm`;
          document.getElementById('assistGuideMessage').textContent = `👉 ${countText}`;
          updateTeacherSpeech(`${targetCm}cm ${mm}mm`, false);
        }
      }

      await sleep(500);

      // ステップ 3: 目的位置で停止・点滅
      const finalX = cmX + (targetMm * (pxPerCm / 10));
      const targetLine = document.getElementById('animTargetLine');
      targetLine.setAttribute('x1', finalX);
      targetLine.setAttribute('x2', finalX);
      targetLine.style.display = 'block';
      targetLine.classList.add('target-line-blink');

      sound.playCountTick(880);
      const finishMsg = `ここが はしっこ！ ぴったり ${targetCm}cm ${targetMm}mm だね！ 解答欄に いれてみよう！`;
      updateTeacherSpeech(finishMsg);
      document.getElementById('assistGuideMessage').textContent = `✅ ぴったり ${targetCm}cm ${targetMm}mm！`;

      STATE.isAnimating = false;
      btn.disabled = false;
    }

    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    /**
     * モード切り替え
     */
    function switchMode(newMode) {
      STATE.mode = newMode;
      const btnAssist = document.getElementById('btnModeAssist');
      const btnChallenge = document.getElementById('btnModeChallenge');
      const assistAnimBar = document.getElementById('assistAnimBar');

      clearHighlights();
      resetAnimationLayer();
      resetZoomView();

      if (newMode === 'assist') {
        btnAssist.classList.add('active');
        btnChallenge.classList.remove('active');
        assistAnimBar.style.display = 'flex';
        updateTeacherSpeech('✨【てだすけ あり】モード だよ。<br>「ズームして アニメーション」を押して、拡大して 目盛りを 数えてみよう！');
      } else {
        btnChallenge.classList.add('active');
        btnAssist.classList.remove('active');
        assistAnimBar.style.display = 'none';
        updateTeacherSpeech('🔥【てだすけ なし】モード だよ。<br>ズームなしで、自分の 目で ものさしの 目盛りを 読んでみよう！');
      }
    }

    /**
     * テンキー操作
     */
    function handleKeyInput(key) {
      sound.playKeyTap();

      if (key === 'backspace') {
        if (STATE.currentSlot === 'cm') {
          STATE.inputCm = STATE.inputCm.slice(0, -1);
        } else {
          if (STATE.inputMm.length > 0) {
            STATE.inputMm = '';
          } else {
            STATE.currentSlot = 'cm';
            STATE.inputCm = STATE.inputCm.slice(0, -1);
          }
        }
      } else if (key === 'enter') {
        checkAnswer();
        return;
      } else {
        // 数字キー '0'〜'9'
        if (STATE.currentSlot === 'cm') {
          if (STATE.inputCm.length < 2) {
            STATE.inputCm += key;
            if (parseInt(STATE.inputCm, 10) > 15) {
              STATE.inputCm = '15';
            }
          }
          if (STATE.inputCm.length >= 1) {
            setTimeout(() => {
              if (STATE.inputCm !== '') {
                STATE.currentSlot = 'mm';
                updateAnswerBoxes();
              }
            }, 300);
          }
        } else {
          STATE.inputMm = key;
        }
      }

      updateAnswerBoxes();
    }

    /**
     * 写真読み込みハンドラ
     */
    function handlePhotoFile(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (e) => {
        STATE.userImageDataUrl = e.target.result;
        STATE.currentPhotoType = 'user';
        updateStageVisuals();
        updateTeacherSpeech('ものさしと 物体の 写真が はいったよ！<br>なんcm なんmmか はかってみよう！');
      };
      reader.readAsDataURL(file);
    }

    /**
     * セレクトボックスの選択肢作成
     */
    function initSelectBoxes() {
      const selectCm = document.getElementById('selectTargetCm');
      const selectMm = document.getElementById('selectTargetMm');

      for (let i = 0; i <= 15; i++) {
        const opt = document.createElement('option');
        opt.value = i;
        opt.textContent = i;
        selectCm.appendChild(opt);
      }

      for (let i = 0; i <= 9; i++) {
        const opt = document.createElement('option');
        opt.value = i;
        opt.textContent = i;
        selectMm.appendChild(opt);
      }

      selectCm.addEventListener('change', (e) => {
        STATE.targetCm = parseInt(e.target.value, 10);
        updateStageVisuals();
      });

      selectMm.addEventListener('change', (e) => {
        STATE.targetMm = parseInt(e.target.value, 10);
        updateStageVisuals();
      });
    }

    /**
     * アプリ初期化
     */
    function initApp() {
      initSelectBoxes();
      renderRulerTicks();
      updateStageVisuals();

      // モード切り替え
      document.getElementById('btnModeAssist').addEventListener('click', () => switchMode('assist'));
      document.getElementById('btnModeChallenge').addEventListener('click', () => switchMode('challenge'));

      // ズームアニメーションボタン
      document.getElementById('btnZoomAnim').addEventListener('click', () => {
        runZoomGuideAnimation();
      });

      // ズームリセットボタン
      document.getElementById('btnResetZoom').addEventListener('click', () => {
        resetZoomView();
      });

      // 写真撮影・読み込みボタン
      const fileInput = document.getElementById('fileInput');
      document.getElementById('btnTakePhoto').addEventListener('click', () => {
        sound.init();
        fileInput.click();
      });
      fileInput.addEventListener('change', handlePhotoFile);

      // 見本写真①
      document.getElementById('btnSamplePhoto1').addEventListener('click', (e) => {
        sound.playKeyTap();
        STATE.currentPhotoType = 'sample1';
        STATE.targetCm = 7;
        STATE.targetMm = 4;
        updateStageVisuals();
        updateTeacherSpeech('見本写真① (ペン) を セットしたよ！<br>ものさしで ながさを はかってみよう！');
      });

      // 見本写真②
      document.getElementById('btnSamplePhoto2').addEventListener('click', (e) => {
        sound.playKeyTap();
        STATE.currentPhotoType = 'sample2';
        STATE.targetCm = 4;
        STATE.targetMm = 2;
        updateStageVisuals();
        updateTeacherSpeech('見本写真② (消しゴム) を セットしたよ！<br>ものさしで ながさを はかってみよう！');
      });

      // 解答スロット選択
      document.getElementById('boxCm').addEventListener('click', () => {
        sound.playKeyTap();
        STATE.currentSlot = 'cm';
        updateAnswerBoxes();
      });

      document.getElementById('boxMm').addEventListener('click', () => {
        sound.playKeyTap();
        STATE.currentSlot = 'mm';
        updateAnswerBoxes();
      });

      // テンキー
      document.querySelectorAll('.key-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          handleKeyInput(e.currentTarget.dataset.key);
        });
      });

      // キーボード入力
      window.addEventListener('keydown', (e) => {
        if (e.key >= '0' && e.key <= '9') {
          handleKeyInput(e.key);
        } else if (e.key === 'Backspace') {
          handleKeyInput('backspace');
        } else if (e.key === 'Enter') {
          handleKeyInput('enter');
        } else if (e.key === 'Tab' || e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
          STATE.currentSlot = (STATE.currentSlot === 'cm') ? 'mm' : 'cm';
          updateAnswerBoxes();
        }
      });

      // もう一度聞く
      document.getElementById('btnReplayVoice').addEventListener('click', () => {
        const plainText = document.getElementById('speechText').textContent;
        speakTeacher(plainText);
      });

      // 音声トグル
      document.getElementById('btnSoundToggle').addEventListener('click', () => {
        STATE.soundEnabled = !STATE.soundEnabled;
        const icon = document.getElementById('soundIcon');
        const text = document.getElementById('soundStatusText');
        if (STATE.soundEnabled) {
          icon.textContent = '🔊';
          text.textContent = 'こえ：ON';
          sound.init();
          sound.playKeyTap();
        } else {
          icon.textContent = '🔇';
          text.textContent = 'こえ：OFF';
          if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        }
      });

      // モーダル次のアクション
      document.getElementById('btnNextAction').addEventListener('click', () => {
        hideHanamaruModal();
        fileInput.click();
      });

      window.addEventListener('pointerdown', () => {
        sound.init();
      }, { once: true });
    }

    window.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
